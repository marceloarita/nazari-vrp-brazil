[project]
name = "nazari-vrp-brazil"
version = "0.1.0"
description = "Nazari et al. 2018 VRP solver with Brazilian geographic distribution extensions"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "scipy>=1.12",
    "wandb>=0.18",
    "ortools>=9.10",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
